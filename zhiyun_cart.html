<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>购物车 - 纸韵匠心文创店</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"微软雅黑","PingFang SC";}
body{background:#F4F4F4;}
.taobao-top{width:100%;height:40px;background:#FFF;line-height:40px;border-bottom:1px solid #EEE;}
.top-content{width:1200px;margin:0 auto;font-size:12px;color:#666;}
.taobao-banner{width:100%;height:120px;background:#FF4400;position:relative;}
.shop-logo{position:absolute;left:30px;top:20px;width:80px;height:80px;border-radius:50%;overflow:hidden;background:#FFF;}
.shop-name{position:absolute;left:130px;top:35px;color:#FFF;font-size:28px;font-weight:bold;}
.shop-desc{position:absolute;left:130px;top:75px;color:#FFF;font-size:14px;}
.taobao-nav{width:100%;height:50px;background:#333;}
.nav-ul{list-style:none;display:flex;line-height:50px;width:1200px;margin:0 auto;}
.nav-ul li{margin:0 25px;}
.nav-ul li a{color:#FFF;text-decoration:none;font-size:16px;}
.nav-ul li a:hover{color:#FFD100;}
.container{width:1200px;margin:0 auto;background:#FFF;padding:20px;box-shadow:0 0 5px #EEE;}
.cart-title{height:50px;line-height:50px;font-size:22px;font-weight:bold;color:#333;border-bottom:2px solid #FF4400;margin-bottom:20px;}
.cart-table{width:100%;border-collapse:collapse;margin-bottom:20px;}
.cart-table th{background:#FAFAFA;border-bottom:2px solid #EEE;padding:12px;text-align:left;font-size:14px;color:#666;}
.cart-table td{border-bottom:1px solid #EEE;padding:12px;font-size:14px;color:#333;}
.cart-pic{width:80px;height:80px;background:#F9F9F9;}
.cart-pic img{width:100%;height:100%;object-fit:cover;}
.qty-btn{width:28px;height:28px;border:1px solid #DDD;background:#FFF;cursor:pointer;font-size:16px;}
.qty-num{width:40px;text-align:center;height:28px;border-top:1px solid #DDD;border-bottom:1px solid #DDD;display:inline-block;line-height:28px;}
.del-btn{color:#FF4400;cursor:pointer;background:none;border:none;font-size:14px;}
.cart-footer{display:flex;justify-content:space-between;align-items:center;padding:20px;border-top:2px solid #EEE;background:#FFFAF0;}
.total-text{font-size:16px;color:#333;}
.total-price{font-size:24px;color:#FF4400;font-weight:bold;margin-left:10px;}
.checkout-btn{padding:0 40px;height:40px;background:#FF4400;color:#FFF;border:none;border-radius:4px;font-size:16px;cursor:pointer;}
.checkout-btn:hover{background:#E53E00;}
.empty-tip{text-align:center;padding:60px 0;color:#999;font-size:14px;}
.taobao-footer{width:100%;height:80px;background:#333;color:#FFF;text-align:center;line-height:80px;font-size:14px;margin-top:20px;}
</style>
</head>
<body>

<div class="taobao-top">
    <div class="top-content">淘宝 · 好物优选 · 纸韵匠心衍纸文创官方店</div>
</div>

<div class="taobao-banner">
    <div class="shop-logo">
        <img src="images/logo.jpg" width="80" height="80">
    </div>
    <div class="shop-name">纸韵匠心文创店</div>
    <div class="shop-desc">手工衍纸饰品 | 汉服配饰DIY材料包</div>
</div>

<div class="taobao-nav">
    <ul class="nav-ul">
        <li><a href="zhiyun_index.html">首页</a></li>
        <li><a href="zhiyun_goods.html">全部商品</a></li>
        <li><a href="zhiyun_cart.html">购物车</a></li>
        <li><a href="zhiyun_order.html">我的订单</a></li>
        <li><a href="zhiyun_address.html">收货地址</a></li>
        <li><a href="zhiyun_coupon.html">优惠券</a></li>
        <li><a href="zhiyun_service.html">联系客服</a></li>
    </ul>
</div>

<div class="container">
    <div class="cart-title">我的购物车</div>
    <table class="cart-table">
        <thead>
            <tr>
                <th style="width:80px;">商品图片</th>
                <th>商品名称</th>
                <th style="width:120px;">单价</th>
                <th style="width:180px;">数量</th>
                <th style="width:100px;">小计</th>
                <th style="width:80px;">操作</th>
            </tr>
        </thead>
        <tbody id="cartBody"></tbody>
    </table>

    <div class="cart-footer">
        <div class="total-text">
            商品总额：<span class="total-price" id="totalPrice">¥0.00</span>
        </div>
        <button class="checkout-btn" onclick="checkout()">去结算</button>
    </div>
</div>

<div class="taobao-footer">纸韵匠心 2026 电商实训项目</div>

<script>
const CART_KEY = "zhiyunjiangxin_cart";
const ORDER_KEY = "zhiyunjiangxin_orders";

function loadCart(){
    return JSON.parse(localStorage.getItem(CART_KEY))||[];
}

function saveCart(cart){
    localStorage.setItem(CART_KEY,JSON.stringify(cart));
}

function renderCart(){
    let cart=loadCart();
    let tbody=document.getElementById('cartBody');

    if(cart.length===0){
        tbody.innerHTML='<tr><td colspan="6" class="empty-tip">购物车是空的，快去选购吧</td></tr>';
        document.getElementById('totalPrice').innerText='¥0.00';
        return;
    }

    let total=0;
    tbody.innerHTML='';

    cart.forEach((item,index)=>{
        let subtotal=item.price*item.quantity;
        total+=subtotal;

        let tr=document.createElement('tr');
        tr.innerHTML=`
            <td><div class="cart-pic"><img src="images/${item.img}" alt="${item.name}"></div></td>
            <td>${item.name}</td>
            <td>¥${item.price.toFixed(2)}</td>
            <td>
                <button class="qty-btn" onclick="changeQty(${index},-1)">-</button>
                <span class="qty-num">${item.quantity}</span>
                <button class="qty-btn" onclick="changeQty(${index},1)">+</button>
            </td>
            <td>¥${subtotal.toFixed(2)}</td>
            <td><button class="del-btn" onclick="delItem(${index})">删除</button></td>
        `;
        tbody.appendChild(tr);
    });

    document.getElementById('totalPrice').innerText='¥'+total.toFixed(2);
}

function changeQty(index,num){
    let cart=loadCart();
    cart[index].quantity+=num;
    if(cart[index].quantity<=0) cart[index].quantity=1;
    saveCart(cart);
    renderCart();
}

function delItem(index){
    let cart=loadCart();
    cart.splice(index,1);
    saveCart(cart);
    renderCart();
}

function checkout(){
    let cart=loadCart();
    if(cart.length===0){
        alert('购物车为空');
        return;
    }

    let total=0;
    cart.forEach(item=>total+=item.price*item.quantity);

    let orders=JSON.parse(localStorage.getItem(ORDER_KEY))||[];
    let orderNo='ZY'+new Date().getTime();

    orders.push({
        orderNo:orderNo,
        createTime:new Date().toLocaleString(),
        total:total.toFixed(2),
        status:'已下单',
        items:JSON.parse(JSON.stringify(cart))
    });

    localStorage.setItem(ORDER_KEY,JSON.stringify(orders));
    localStorage.removeItem(CART_KEY);

    alert('下单成功！订单号：'+orderNo);
    location.href='zhiyun_order.html';
}

renderCart();
</script>

</body>
</html>
