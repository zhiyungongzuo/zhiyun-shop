<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>收货地址 - 纸韵匠心文创店</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"微软雅黑","PingFang SC";}
body{background:#F4F4F4;}
.taobao-top{width:100%;height:40px;background:#FFF;line-height:40px;border-bottom:1px solid #EEE;}
.top-content{width:1200px;margin:0 auto;font-size:12px;color:#666;}
.taobao-banner{width:100%;height:120px;background:#FF4400;position:relative;}
.shop-logo{position:absolute;left:30px;top:20px;width:80px;height:80px;border-radius:50%;overflow:hidden;background:#FFF;}
.shop-name{position:absolute;left:130px;top:35px;color:#FFF;font-size:28px;font-weight:bold;}
.shop-desc{position:absolute;left:130px;top:75px;color:#FFF;font-size:14px;}
.taobao-nav{width:100%;height:50px;background:#333;}
.nav-ul{list-style:none;display:flex;line-height:50px;width:1200px;margin:0 auto;}
.nav-ul li{margin:0 25px;}
.nav-ul li a{color:#FFF;text-decoration:none;font-size:16px;}
.nav-ul li a:hover{color:#FFD100;}
.container{width:1200px;margin:0 auto;background:#FFF;padding:20px;box-shadow:0 0 5px #EEE;}
.address-title{height:50px;line-height:50px;font-size:22px;font-weight:bold;color:#333;border-bottom:2px solid #FF4400;margin-bottom:20px;}
.address-form{width:600px;margin:0 auto;padding:20px;background:#FFFAF0;border:1px solid #FFE7D6;border-radius:4px;}
.form-item{margin-bottom:15px;}
.form-item label{display:block;font-size:14px;color:#333;margin-bottom:6px;}
.form-item input{width:100%;height:36px;border:1px solid #DDD;border-radius:4px;padding:0 10px;font-size:14px;}
.save-btn{width:100%;height:40px;background:#FF4400;color:#FFF;border:none;border-radius:4px;font-size:16px;cursor:pointer;}
.save-btn:hover{background:#E53E00;}
.address-list{margin-top:20px;}
.address-card{border:1px solid #EEE;padding:15px;margin-bottom:10px;border-radius:4px;background:#FFF;}
.address-card p{font-size:14px;color:#333;line-height:24px;}
.taobao-footer{width:100%;height:80px;background:#333;color:#FFF;text-align:center;line-height:80px;font-size:14px;margin-top:20px;}
</style>
</head>
<body>

<div class="taobao-top">
    <div class="top-content">淘宝 · 好物优选 · 纸韵匠心衍纸文创官方店</div>
</div>

<div class="taobao-banner">
    <div class="shop-logo">
        <img src="images/logo.jpg" width="80" height="80">
    </div>
    <div class="shop-name">纸韵匠心文创店</div>
    <div class="shop-desc">手工衍纸饰品 | 汉服配饰DIY材料包</div>
</div>

<div class="taobao-nav">
    <ul class="nav-ul">
        <li><a href="zhiyun_index.html">首页</a></li>
        <li><a href="zhiyun_goods.html">全部商品</a></li>
        <li><a href="zhiyun_cart.html">购物车</a></li>
        <li><a href="zhiyun_order.html">我的订单</a></li>
        <li><a href="zhiyun_address.html">收货地址</a></li>
        <li><a href="zhiyun_coupon.html">优惠券</a></li>
        <li><a href="zhiyun_service.html">联系客服</a></li>
    </ul>
</div>

<div class="container">
    <div class="address-title">收货地址管理</div>

    <div class="address-form">
        <div class="form-item">
            <label>收货人</label>
            <input type="text" id="name" placeholder="请输入收货人姓名">
        </div>
        <div class="form-item">
            <label>联系电话</label>
            <input type="text" id="phone" placeholder="请输入联系电话">
        </div>
        <div class="form-item">
            <label>详细地址</label>
            <input type="text" id="address" placeholder="请输入省、市、区及详细地址">
        </div>
        <button class="save-btn" onclick="saveAddress()">保存地址</button>
    </div>

    <div class="address-list" id="addressList"></div>
</div>

<div class="taobao-footer">纸韵匠心 2026 电商实训项目</div>

<script>
const ADDRESS_KEY = "zhiyunjiangxin_address";

function loadAddress(){
    return JSON.parse(localStorage.getItem(ADDRESS_KEY))||[];
}

function saveAddress(){
    let name=document.getElementById('name').value.trim();
    let phone=document.getElementById('phone').value.trim();
    let address=document.getElementById('address').value.trim();

    if(!name||!phone||!address){
        alert('请填写完整地址信息');
        return;
    }

    let list=loadAddress();
    list.push({name,phone,address});
    localStorage.setItem(ADDRESS_KEY,JSON.stringify(list));

    document.getElementById('name').value='';
    document.getElementById('phone').value='';
    document.getElementById('address').value='';

    alert('地址保存成功');
    renderAddress();
}

function renderAddress(){
    let list=loadAddress();
    let box=document.getElementById('addressList');

    if(list.length===0){
        box.innerHTML='';
        return;
    }

    box.innerHTML='';
    list.forEach((item,index)=>{
        let card=document.createElement('div');
        card.className='address-card';
        card.innerHTML=`
            <p><strong>收货人：</strong>${item.name}</p>
            <p><strong>联系电话：</strong>${item.phone}</p>
            <p><strong>详细地址：</strong>${item.address}</p>
        `;
        box.appendChild(card);
    });
}

renderAddress();
</script>

</body>
</html>
