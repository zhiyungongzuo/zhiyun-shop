<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>我的订单 - 纸韵匠心文创店</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"微软雅黑","PingFang SC";}
body{background:#F4F4F4;}
.taobao-top{width:100%;height:40px;background:#FFF;line-height:40px;border-bottom:1px solid #EEE;}
.top-content{width:1200px;margin:0 auto;font-size:12px;color:#666;}
.taobao-banner{width:100%;height:120px;background:#FF4400;position:relative;}
.shop-logo{position:absolute;left:30px;top:20px;width:80px;height:80px;border-radius:50%;overflow:hidden;background:#FFF;}
.shop-name{position:absolute;left:130px;top:35px;color:#FFF;font-size:28px;font-weight:bold;}
.shop-desc{position:absolute;left:130px;top:75px;color:#FFF;font-size:14px;}
.taobao-nav{width:100%;height:50px;background:#333;}
.nav-ul{list-style:none;display:flex;line-height:50px;width:1200px;margin:0 auto;}
.nav-ul li{margin:0 25px;}
.nav-ul li a{color:#FFF;text-decoration:none;font-size:16px;}
.nav-ul li a:hover{color:#FFD100;}
.container{width:1200px;margin:0 auto;background:#FFF;padding:20px;box-shadow:0 0 5px #EEE;}
.order-title{height:50px;line-height:50px;font-size:22px;font-weight:bold;color:#333;border-bottom:2px solid #FF4400;margin-bottom:20px;}
.order-card{border:1px solid #EEE;margin-bottom:15px;padding:15px;border-radius:4px;background:#FFFAF0;}
.order-head{display:flex;justify-content:space-between;padding-bottom:10px;border-bottom:1px dashed #EEE;margin-bottom:10px;font-size:14px;color:#666;}
.order-no{color:#FF4400;font-weight:bold;}
.order-item{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;color:#333;border-bottom:1px dotted #F0F0F0;}
.order-total{text-align:right;padding-top:10px;font-size:16px;color:#333;}
.order-total span{color:#FF4400;font-weight:bold;font-size:20px;margin-left:10px;}
.empty-tip{text-align:center;padding:60px 0;color:#999;font-size:14px;}
.taobao-footer{width:100%;height:80px;background:#333;color:#FFF;text-align:center;line-height:80px;font-size:14px;margin-top:20px;}
</style>
</head>
<body>

<div class="taobao-top">
    <div class="top-content">淘宝 · 好物优选 · 纸韵匠心衍纸文创官方店</div>
</div>

<div class="taobao-banner">
    <div class="shop-logo">
        <img src="images/logo.jpg" width="80" height="80">
    </div>
    <div class="shop-name">纸韵匠心文创店</div>
    <div class="shop-desc">手工衍纸饰品 | 汉服配饰DIY材料包</div>
</div>

<div class="taobao-nav">
    <ul class="nav-ul">
        <li><a href="zhiyun_index.html">首页</a></li>
        <li><a href="zhiyun_goods.html">全部商品</a></li>
        <li><a href="zhiyun_cart.html">购物车</a></li>
        <li><a href="zhiyun_order.html">我的订单</a></li>
        <li><a href="zhiyun_address.html">收货地址</a></li>
        <li><a href="zhiyun_coupon.html">优惠券</a></li>
        <li><a href="zhiyun_service.html">联系客服</a></li>
    </ul>
</div>

<div class="container">
    <div class="order-title">我的订单</div>
    <div id="orderList"></div>
</div>

<div class="taobao-footer">纸韵匠心 2026 电商实训项目</div>

<script>
const ORDER_KEY = "zhiyunjiangxin_orders";

function loadOrders(){
    return JSON.parse(localStorage.getItem(ORDER_KEY))||[];
}

function renderOrders(){
    let orders=loadOrders();
    let box=document.getElementById('orderList');

    if(orders.length===0){
        box.innerHTML='<div class="empty-tip">暂无订单信息</div>';
        return;
    }

    box.innerHTML='';

    orders.forEach(order=>{
        let card=document.createElement('div');
        card.className='order-card';

        let itemsHtml='';
        order.items.forEach(item=>{
            itemsHtml+=`
                <div class="order-item">
                    <span>${item.name} × ${item.quantity}</span>
                    <span>¥${(item.price*item.quantity).toFixed(2)}</span>
                </div>
            `;
        });

        // 修正：直接嵌入变量 ${itemsHtml}
        card.innerHTML=`
            <div class="order-head">
                <span>订单号：<span class="order-no">${order.orderNo}</span></span>
                <span>下单时间：${order.createTime}</span>
                <span>状态：${order.status}</span>
            </div>
            ${itemsHtml}
            <div class="order-total">
                订单总额：<span>¥${order.total}</span>
            </div>
        `;

        box.appendChild(card);
    });
}

renderOrders();
</script>

</body>
</html>
